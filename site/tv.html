<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&!/^(localhost|127\.)/.test(location.hostname))location.replace("https:"+location.href.slice(5));</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집안일 현황판</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root { --bg:#0b0d10; --card:rgba(18,21,27,.72); --text:#f2f4f8; --muted:#a8b1c0; --line:rgba(255,255,255,.22); --a:#8fb0ff; --a-soft:rgba(143,176,255,.2); --b:#ff9d78; --b-soft:rgba(255,157,120,.2); --ease-out:cubic-bezier(.16,1,.3,1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 2.2vh/1.3 "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }

/* 배경: 같은 사진의 아주 작은 버전을 늘려서 부드럽게 (실시간 블러 없이 가볍게) */
.bd { position: fixed; inset: 0; background: #111 center / cover no-repeat; opacity: 0; transition: opacity 1.6s ease-in-out; }
.bd.on { opacity: 1; }
.shade { position: fixed; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,.55)); }

#tv { position: relative; height: 100vh; padding: 3vh 2.6vw; display: flex; gap: 2.4vw; }
.photo { flex: none; height: 100%; width: 33vw; position: relative; border-radius: 2.2vh; overflow: hidden; background: #000; box-shadow: 0 1.5vh 5vh rgba(0,0,0,.5); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s ease-in-out; }
.photo img.on { opacity: 1; animation: kb 24s linear forwards; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.06); } }
.photo.none { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2vh; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; }
.top h1 { margin: 0; font-size: 4.2vh; letter-spacing: -.02em; text-shadow: 0 .2vh 1vh rgba(0,0,0,.5); }
.top .wk { font-size: 2.8vh; font-weight: 700; color: var(--muted); }
.clock { text-align: right; line-height: 1; }
.clock b { display: block; font-size: 8vh; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 .3vh 1.4vh rgba(0,0,0,.5); }
.clock span { font-size: 2.6vh; color: var(--muted); }
.days { display: flex; gap: .8vw; }
.day { flex: 1; text-align: center; padding: .8vh 0; border-radius: 1.4vh; color: var(--muted); font-size: 2.2vh; background: var(--card); }
.day b { display: block; font-size: 3vh; color: var(--text); }
.day.today { outline: .3vh solid var(--text); color: var(--text); }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.4vw; }
.card { min-width: 0; overflow: hidden; background: var(--card); border-radius: 2vh; padding: 2vh 1.2vw; display: flex; flex-direction: column; min-height: 0; border-top: .7vh solid var(--c); -webkit-backdrop-filter: none; }
.card.a { --c: var(--a); --soft: var(--a-soft); } .card.b { --c: var(--b); --soft: var(--b-soft); }
.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .8vh; }
.head h2 { margin: 0; font-size: 3.6vh; color: var(--c); }
.head .prog { font-size: 2.4vh; color: var(--muted); } .head .prog b { color: var(--text); font-size: 3.2vh; }
.last { font-size: 1.8vh; color: var(--muted); margin: -.4vh 0 .8vh; }
.meter { height: 1vh; border-radius: 9px; background: var(--soft); overflow: hidden; margin-bottom: 1.2vh; }
.meter i { display: block; height: 100%; background: var(--c); transition: width .6s ease-out; }
.list { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: .6vw; padding: 0; flex: 0 0 var(--rh, auto); min-height: 0; }
.row .nm { font-size: var(--fs, 2.5vh); font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gh { display: flex; justify-content: space-between; align-items: flex-end; flex: 0 0 var(--rh, auto); padding-bottom: .2vh; border-bottom: .2vh solid var(--line); font-size: calc(var(--fs, 2.5vh) * .8); font-weight: 700; color: var(--muted); }
.row.full .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: .2vh; }
.row.late .nm { color: #ffd166; }
.pips { display: flex; gap: .2vh; flex: none; }
.pipb { padding: calc(var(--pip, 3.2vh) * .1); display: block; }
.pipb:focus { outline: .45vh solid #fff; outline-offset: .05vh; }
.pip { width: var(--pip, 3.2vh); height: var(--pip, 3.2vh); border-radius: 50%; border: .3vh solid var(--line); display: grid; place-items: center; }
.pip.on { background: var(--c); border-color: var(--c); }
.pip svg { width: 70%; height: 70%; fill: none; stroke: #0e1013; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.empty { color: var(--muted); text-align: center; margin: auto; font-size: 2.6vh; }
/* 배경음악: 유튜브 임베드 (약관상 영상이 보이는 크기로 우측 상단에 둠) */
#ytw { position: fixed; top: 3vh; right: 2.6vw; width: 200px; height: 200px; border-radius: 1.2vh; overflow: hidden; background: #000; z-index: 5; box-shadow: 0 1vh 3vh rgba(0,0,0,.5); }
#ytw[hidden] { display: none; }
#yt, #ytw iframe { width: 100%; height: 100%; border: 0; display: block; }
#ytb { position: absolute; inset: 0; width: 100%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-weight: 700; font-size: 2vh; font-family: inherit; cursor: pointer; }
#ytb.on { background: transparent; color: transparent; }
#ytb:focus { outline: .45vh solid #fff; outline-offset: -.45vh; }
.top, .days { padding-right: calc(200px + 1.6vw); }
.off { position: fixed; right: 2vw; bottom: 1.5vh; font-size: 2vh; color: #ff6b5e; }

/* 로그인 */
#login { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; }
#login[hidden] { display: none; }
#login form { width: min(90vw, 56vh); text-align: center; }
#login h1 { font-size: 5vh; margin: 0 0 1vh; }
#login p { color: var(--muted); font-size: 2.4vh; margin: 0 0 3vh; }
#login input { width: 100%; font-size: 3.6vh; padding: 1.6vh 2vh; border-radius: 1.6vh; border: .3vh solid var(--line); background: #171a20; color: var(--text); text-align: center; }
#login input:focus { outline: .4vh solid #fff; }
#login button { margin-top: 2vh; width: 100%; font-size: 3.2vh; font-weight: 700; padding: 1.6vh; border: 0; border-radius: 1.6vh; background: var(--a); color: #0e1013; cursor: pointer; }
#login button:focus { outline: .4vh solid #fff; outline-offset: .2vh; }
#login .err { color: #ff6b5e; font-size: 2.4vh; min-height: 3.2vh; margin-top: 1.6vh; }
</style>
</head>
<body>
<div class="bd" id="bd0"></div><div class="bd" id="bd1"></div><div class="shade"></div>
<div id="tv"></div>
<div id="ytw" hidden><div id="yt"></div><button id="ytb" type="button">▶ 음악 켜기</button></div>
<div class="off" id="off" hidden>연결 끊김 · 다시 시도 중</div>
<div id="login" hidden><form id="lf" autocomplete="off"><h1>집안일 현황판</h1><p>비밀번호를 입력하세요</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="비밀번호">
  <button type="submit" id="go">들어가기</button><div class="err" id="err"></div></form></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script type="module">
import * as C from './core.js';
import { grpOf, GORDER } from './groups.js';
const { URL: SB_URL, ANON, KEY } = window.HW;
const PAD = 'hw!tv'; // 서버 최소 길이(6자)를 맞추려고 입력값 뒤에 붙임
const EMAIL = 'tv@housework.local', BUCKET = 'hwphotos', SLIDE_MS = 20000;
const sb = window.supabase.createClient(SB_URL, ANON, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'hw-tv-auth' } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
let data = null, started = false;

// ───────── 로그인
function showLogin(msg) { $('#login').hidden = false; $('#err').textContent = msg || ''; setTimeout(() => $('#pw').focus(), 50); }
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('#pw').value; if (!pw) return;
  $('#go').disabled = true; $('#err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: EMAIL, password: pw + PAD });
  $('#go').disabled = false;
  if (error) { $('#pw').value = ''; $('#err').textContent = /network|fetch/i.test(error.message) ? '연결할 수 없어요' : '비밀번호가 맞지 않아요'; return; }
  $('#pw').value = ''; $('#login').hidden = true; start();
});

// ───────── 체크 현황
function lastTxt(who) {
  const t = data.last && data.last[who]; if (!t) return '';
  const k = (ms) => new Date(ms + 9 * 3600e3), d = k(Date.parse(t)), n = k(Date.now()), p = (x) => String(x).padStart(2, '0');
  const same = d.toISOString().slice(0, 10) === n.toISOString().slice(0, 10);
  return `<div class="last">마지막 체크 ${same ? '오늘' : `${d.getUTCMonth() + 1}/${d.getUTCDate()}`} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}</div>`;
}
function mainHtml() {
  const cfg = C.sanitizeConfig(data.config || C.cloneDefault());
  const now = C.kstNow(), wk = C.mondayOf(now.ymd);
  const checks = {}; for (const k of data.checks || []) if (k.wk === wk) checks[k.chore] = k.done;
  const [, wm, wd] = wk.split('-').map(Number);
  const wlabel = `${wm}월 ${['첫째', '둘째', '셋째', '넷째', '다섯째'][Math.ceil(wd / 7) - 1]}주`;
  const days = '월화수목금토일'.split('').map((w, i) => { const y = C.addDays(wk, i);
    return `<div class="day${y === now.ymd ? ' today' : ''}">${w}<b>${Number(y.slice(8))}</b></div>`; }).join('');
  const person = (s) => {
    const list = C.choresOf(cfg, wk, s);
    const sum = list.reduce((a, c) => a + c.per, 0);
    const done = list.reduce((a, c) => a + Math.min(checks[c.id] || 0, c.per), 0);
    const rowHtml = (c) => {
      const d = Math.min(checks[c.id] || 0, c.per);
      const late = d < C.dueBy(c.per, now.dow);
      const pips = Array.from({ length: c.per }, (_, i) => `<span class="pipb"><span class="pip${i < d ? ' on' : ''}">${i < d ? CHECK : ''}</span></span>`).join('');
      return `<div class="row${d >= c.per ? ' full' : ''}${late ? ' late' : ''}"><span class="nm">${esc(c.name)}</span><span class="pips">${pips}</span></div>`;
    };
    // 묶음 제목(진행률) + 항목. 오늘까지 했어야 하는데 못 한 항목은 노란색
    const rows = GORDER.map((g) => {
      const mem = list.filter((c) => grpOf(c.name) === g); if (!mem.length) return '';
      const gd = mem.reduce((a, c) => a + Math.min(checks[c.id] || 0, c.per), 0), gt = mem.reduce((a, c) => a + c.per, 0);
      return `<div class="gh"><span>${g}</span><span>${gd}/${gt}</span></div>` + mem.map(rowHtml).join('');
    }).join('');
    return `<section class="card ${s.toLowerCase()}"><div class="head"><h2>${esc(cfg.names[s])}</h2><span class="prog"><b>${done}</b>/${sum}회</span></div>${lastTxt(s)}
      <div class="meter"><i style="width:${sum ? (done / sum) * 100 : 0}%"></i></div><div class="list">${rows || '<div class="empty">이번 주 담당 없음</div>'}</div></section>`;
  };
  const k = new Date(Date.now() + 9 * 3600e3), p2 = (x) => String(x).padStart(2, '0');
  return { wlabel, days, cols: person('A') + person('B'), time: `${p2(k.getUTCHours())}:${p2(k.getUTCMinutes())}`, date: `${k.getUTCMonth() + 1}월 ${k.getUTCDate()}일 ${'일월화수목금토'[k.getUTCDay()]}요일` };
}
function render() {
  if (!data) return;
  const root = $('#tv'), m = mainHtml();
  const fa = document.activeElement, fk = fa && fa.dataset && fa.dataset.c ? fa.dataset.o + '|' + fa.dataset.c + '|' + fa.dataset.i : null;
  const tops = [...document.querySelectorAll('.list')].map((l) => l.scrollTop);
  let ph = root.querySelector('.photo');
  if (!ph) { root.innerHTML = `<div class="photo none" id="ph"><img id="i0" alt=""><img id="i1" alt=""></div><div class="main" id="mn"></div>`; photoReady(); }
  $('#mn').innerHTML = `<div class="top"><div><h1>집안일 임무분담제</h1><span class="wk">${m.wlabel}</span></div><div class="clock"><b>${m.time}</b><span>${m.date}</span></div></div>
    <div class="days">${m.days}</div><div class="cols">${m.cols}</div>`;
  fit();
  document.querySelectorAll('.list').forEach((l, i) => { if (tops[i]) { l.scrollTop = tops[i]; const st = SC.get(l); if (st) st.y = tops[i]; } });
  let el = null;
  if (fk) { const [o, c, i] = fk.split('|'); el = [...root.querySelectorAll('.pipb')].find((b) => b.dataset.o === o && b.dataset.c === c && b.dataset.i === i); }
  (el || root.querySelector('.pipb'))?.focus({ preventScroll: true });
}
// 항목이 많으면 글자·동그라미를 자동으로 줄여서 화면 안에 다 들어가게
function fit() {
  const mn = $('#mn'), lists = [...document.querySelectorAll('.list')]; if (!mn || !lists.length) return;
  const n = Math.max(1, ...lists.map((l) => l.children.length)), h = lists[0].clientHeight || innerHeight * 0.5;
  const minRow = Math.max(22, innerHeight * 0.03);           // 이보다 작게는 줄이지 않음 (겹침 방지)
  const rh = n * minRow <= h ? Math.min(h / n, innerHeight * 0.06) : minRow; // 다 들어가면 꽉 채워서, 아니면 최소 높이 + 자동 스크롤
  mn.style.setProperty('--rh', rh + 'px');
  mn.style.setProperty('--fs', Math.max(11, Math.min(rh * 0.52, innerHeight * 0.025)) + 'px');
  mn.style.setProperty('--pip', Math.max(11, Math.min(rh * 0.6, innerHeight * 0.032)) + 'px');
}
// 한 화면에 안 들어가는 목록은 천천히 아래로 자동 스크롤 (끝에서 잠시 멈췄다 처음으로)
const SC = new WeakMap();
setInterval(() => {
  for (const l of document.querySelectorAll('.list')) {
    const max = l.scrollHeight - l.clientHeight; if (max <= 2) { l.scrollTop = 0; continue; }
    const st = SC.get(l) || { y: l.scrollTop, hold: 60 };
    if (st.hold > 0) { st.hold--; }
    else { st.y += 0.7; if (st.y >= max) { st.y = max; st.hold = 80; SC.set(l, st); l.scrollTop = st.y; st.reset = true; } else { l.scrollTop = st.y; } }
    if (st.reset && st.hold === 0) { st.y = 0; st.hold = 60; st.reset = false; l.scrollTop = 0; }
    SC.set(l, st);
  }
}, 40);
addEventListener('resize', fit);
let pending = 0;
async function refresh() {
  if (pending > 0) return;
  const { data: d, error } = await sb.rpc('hw_get', { p_key: KEY });
  $('#off').hidden = !error;
  if (error) return;
  data = d; render();
}
// ───────── 사진 슬라이드 (로그인한 사람만 비공개 저장소에서 읽음)
const P = { items: [], idx: -1, flip: 0, urls: {}, loaded: false };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
async function loadPhotos() {
  try {
    const { data: files, error } = await sb.storage.from(BUCKET).list('', { limit: 1000 });
    if (error || !files) return;
    const names = files.map((f) => f.name).filter((n) => /^\d+\.jpg$/.test(n));
    if (!names.length) return;
    const paths = names.flatMap((n) => [n, n.replace('.jpg', 't.jpg')]);
    const { data: signed } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
    if (!signed) return;
    const m = {}; for (const s of signed) if (s.signedUrl) m[s.path] = s.signedUrl;
    P.urls = m; P.items = shuffle(names.filter((n) => m[n] && m[n.replace('.jpg', 't.jpg')])); P.loaded = true;
  } catch { /* 사진 없이도 현황은 동작 */ }
}
function preload(url) { return new Promise((res) => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; }); }
async function nextPhoto() {
  if (!P.items.length) return;
  for (let t = 0; t < 3; t++) {
    P.idx = (P.idx + 1) % P.items.length;
    const n = P.items[P.idx], u = P.urls[n], tu = P.urls[n.replace('.jpg', 't.jpg')];
    if (!(await preload(u))) continue;
    const f = P.flip ^= 1, im = $('#i' + f), old = $('#i' + (f ^ 1)), bd = $('#bd' + f), obd = $('#bd' + (f ^ 1));
    if (!im) return;
    im.classList.remove('on'); void im.offsetWidth; im.src = u; bd.style.backgroundImage = `url("${tu}")`;
    im.classList.add('on'); bd.classList.add('on'); old.classList.remove('on'); obd.classList.remove('on');
    $('#ph').classList.remove('none');
    return;
  }
}
function photoReady() { if (P.items.length) nextPhoto(); }

// ───────── 배경음악 (브라우저 규칙상 소리는 리모컨 확인 버튼을 한 번 눌러야 시작됨)
const VID = 'YVZrx1-UQvU'; let yp = null;
function initMusic() {
  $('#ytw').hidden = false;
  window.onYouTubeIframeAPIReady = () => {
    yp = new YT.Player('yt', { videoId: VID, playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1, loop: 1, playlist: VID, iv_load_policy: 3, fs: 0, disablekb: 1 },
      events: {
        onStateChange: (e) => { const b = $('#ytb'); b.classList.toggle('on', e.data === 1 || e.data === 3); b.textContent = e.data === 1 || e.data === 3 ? '' : e.data === 2 ? '▶ 계속 재생' : '▶ 음악 켜기'; },
        onError: () => { $('#ytb').classList.remove('on'); $('#ytb').textContent = '이 영상은 재생할 수 없어요'; },
      } });
  };
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
  $('#ytb').addEventListener('click', () => { if (!yp || !yp.getPlayerState) return; if (yp.getPlayerState() === 1) yp.pauseVideo(); else yp.playVideo(); });
  setTimeout(() => $('#ytb').focus(), 600);
}

// ───────── 시작
async function start() {
  if (started) return; started = true;
  initMusic();
  refresh();
  setInterval(refresh, 30000);
  setInterval(() => { if (data && pending === 0) render(); }, 60000); // 시계·자정 넘김
  sha(KEY).then((h) => { let t; sb.channel('hw-' + h.slice(0, 16)).on('broadcast', { event: 'sync' }, () => { clearTimeout(t); t = setTimeout(refresh, 150); }).subscribe(); }).catch(() => {});
  await loadPhotos(); photoReady();
  setInterval(nextPhoto, SLIDE_MS);
  setInterval(async () => { await loadPhotos(); }, 50 * 60 * 1000); // 사진 주소 갱신
}
async function sha(s) { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, '0')).join(''); }
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
(async () => {
  const { data: s } = await sb.auth.getSession();
  if (s && s.session) start(); else showLogin();
})();
</script>
</body>
</html>
