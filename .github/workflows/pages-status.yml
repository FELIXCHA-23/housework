name: Pages status (read-only)
on: { workflow_dispatch: {} }
permissions: { pages: write, contents: read }
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api repos/${{ github.repository }}/pages | jq '{cname, https_enforced, https_certificate}'
          curl -sSI https://home.kastlemath.com/ | head -3 || echo "HTTPS FAIL"
          curl -sSI http://home.kastlemath.com/ | head -3
        env: { GH_TOKEN: "${{ github.token }}" }
